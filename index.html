<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f1218" />
    <link rel="icon" type="image/png" href="./favicon-32.png" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <title>House CAD</title>
  </head>
  <body>
    <div id="app">
      <div id="work-indicator" role="status" aria-live="polite" hidden>
        <span class="work-light" aria-hidden="true"></span>
        <span id="work-label">WORKING</span>
      </div>
      <div id="view3d-loading" role="status" aria-live="polite" hidden>
        <span class="view3d-wheel" aria-hidden="true"></span>
        <span id="view3d-loading-text">Preparing 3D…</span>
      </div>
      <main id="panes">
        <section id="pane-2d">
          <canvas id="sketch"></canvas>
          <div class="pane-label">Plan (2D)</div>
          <aside id="floor-ctl">
            <div class="fc-head">
              <span class="fc-title">Floors</span>
              <button id="fc-add-above" title="Add a floor above the active one">＋▲</button>
              <button id="fc-add-below" title="Add a floor below the active one">＋▼</button>
            </div>
            <div class="fc-transfer">
              <button id="fc-copy" title="Copy the active floor, including dimensions and markers">Copy floor</button>
              <button id="fc-paste" title="Replace the active floor's plan with the copied floor">Paste floor</button>
            </div>
            <div id="fc-list" class="fc-list"></div>
          </aside>
          <div id="zoom-ctl">
            <button id="zoom-in" title="Zoom in" aria-label="Zoom in">+</button>
            <button id="zoom-out" title="Zoom out" aria-label="Zoom out">−</button>
          </div>
          <aside id="constraints">
            <button class="cx-head" id="cx-toggle" aria-expanded="true" title="Collapse / expand">
              <span class="cx-caret">▾</span>
              <span class="cx-title">Dimensions</span>
              <span class="cx-count" id="cx-count"></span>
            </button>
            <div id="cx-list" class="cx-list">
              <div class="cx-empty">No dimensions yet. Use 📏 to constrain edge distances.</div>
            </div>
          </aside>
          <aside id="props" hidden>
            <div class="cx-head">Rectangle</div>
            <div class="prop-grid">
              <label>X</label><input id="p-x" type="number" step="0.1" /><span class="unit">m</span>
              <label>Y</label><input id="p-y" type="number" step="0.1" /><span class="unit">m</span>
            </div>
            <div class="prop-row">
              <button id="p-op" class="op-toggle" title="Cycle room / wall / insulation / door / half wall / window / stairs up / stairs down / cabinet / furniture"></button>
              <button id="p-del" title="Delete rectangle (Del)">🗑 Delete</button>
            </div>
            <div class="prop-row" id="p-aperture-row" hidden>
              <button id="p-rot" title="Rotate the door/window: hinge left/right × swing in/out"></button>
            </div>
            <div class="prop-row" id="p-outdoor-row" hidden>
              <button id="p-outdoor" title="Indoor / outdoor room: an outdoor room (a veranda) is outside for heat loss"></button>
            </div>
          </aside>
        </section>
      </main>
      <!-- Kept alive at all times because WebXR uses this renderer. On desktop
           VIEW 3D brings it on-screen; otherwise CSS parks it off-screen at a
           real size so its canvas/aspect remain valid for AR startup. -->
      <section id="view3d-holder" aria-hidden="true">
        <div id="view3d"></div>
        <div class="pane-label">Model (3D)</div>
        <aside id="view3d-floor-ctl" aria-label="3D floor visibility">
          <button id="view3d-floor-toggle" class="view3d-floor-title" type="button" aria-expanded="true"
            title="Collapse / expand"><span class="cx-caret">▾</span> Floors<span id="view3d-floor-current"></span></button>
          <div id="view3d-floor-list"></div>
          <button id="view3d-lighting" type="button" aria-pressed="false"
            title="Enable marker lights and dynamic shadows">☼ Basic lighting</button>
          <button id="view3d-reflections" type="button" aria-pressed="false"
            title="Reflect a soft room in glossy finishes (heavier on some devices)">✧ No reflections</button>
          <button id="view3d-realistic" type="button" aria-pressed="false"
            title="Real sun and shadows, a downloaded sky, ambient occlusion (heavier)">◑ Realistic</button>
          <button id="view3d-windows" type="button" aria-pressed="false"
            title="Open every window leaf as far as it goes before it hits furniture or a wall">▯ Windows closed</button>
          <label id="view3d-sun" class="view3d-sun" hidden title="Time of day for the sun (today, north = plan up)">
            <span id="view3d-sun-label">☀ 12:00</span>
            <input id="view3d-sun-time" type="range" min="4" max="22.5" step="0.25" value="12">
          </label>
          <div id="view3d-sky-status" class="view3d-sky-status" hidden></div>
        </aside>
        <!-- Shown only in POV (view3d.js onNavigationChange). -->
        <div id="view3d-nav" hidden>
          <button id="view3d-overview" type="button" title="Back to the top-down overview">▦ Overview</button>
          <button id="view3d-tilt" type="button" aria-pressed="false" hidden
            title="Look around by moving the phone">◎ Tilt look</button>
        </div>
      </section>
      <footer id="toolbar">
        <span class="brand">House&nbsp;CAD</span>
        <div class="group" id="tool-group">
          <button data-tool="add" class="active" title="Draw a rectangle that adds matter">➕ Add</button>
          <button data-tool="subtract" title="Draw a rectangle that removes matter">➖ Subtract</button>
          <button data-tool="dimension" title="Constrain the distance between two edges">📏 Dimension</button>
          <button data-tool="select" title="Select / move / delete rectangles">🖟 Select</button>
          <button data-tool="pan" title="Pan the view (drag anywhere)">✋ Pan</button>
        </div>
        <div class="group">
          <label>Height <input id="height" type="number" min="0.1" step="0.1" value="2.8" /> <span class="unit-label">m</span></label>
        </div>
        <div class="group">
          <label>Units
            <select id="unit">
              <option value="m">m</option>
              <option value="cm">cm</option>
              <option value="mm">mm</option>
            </select>
          </label>
        </div>
        <div class="group">
          <button id="delete" title="Delete selected (Del)">🗑 Delete</button>
          <button id="clear" title="Remove all rectangles">Clear</button>
        </div>
        <div class="group">
          <button id="save" title="Download the project as a .json file">💾 Save</button>
          <button id="load" title="Open a .json project file">📂 Load</button>
          <button id="share-view" title="Copy a view-only 3D link (geometry travels in the URL; not editable)">🔗 Share view</button>
          <input id="file-input" type="file" accept="application/json,.json" hidden />
        </div>
        <div class="group menu" id="export-menu">
          <button id="export-btn" title="Export the 3D model as a mesh">⬇ Export ▾</button>
          <div class="menu-pop" id="export-pop" hidden>
            <button data-fmt="stl" title="Binary STL — for 3D printing">STL (.stl)</button>
            <button data-fmt="obj" title="Wavefront OBJ — plain text">OBJ (.obj)</button>
            <button data-fmt="glb" title="Binary glTF — single file, best for sharing">glTF (.glb)</button>
          </div>
        </div>
        <div class="group menu" id="print-menu">
          <button id="print-btn" title="Print or download a to-scale floor-plan sheet">🖨 Print ▾</button>
          <div class="menu-pop" id="print-pop" hidden>
            <label id="print-lang-row" title="Language of the exported/printed sheet text (labels, legends, floor names). Independent of the app language. Applies to Print / SVG / PNG.">Language
              <select id="print-lang"></select>
            </label>
            <label id="print-baseline-row" title="Compare the printed sheet against a saved slot — changed zones, fixtures, and dimensions are marked with change clouds and numbered tags. Applies to Print / SVG / PNG.">Change map vs
              <select id="print-baseline"><option value="">No comparison</option></select>
            </label>
            <button data-print="all" title="Print every floor, one to-scale sheet each — choose 'Save as PDF' and print at 100% (actual size)">Print all floors…</button>
            <button data-print="svg" title="Download this floor as a vector SVG sheet (true scale; open in a viewer or drop into a PDF)">Download SVG (this floor)</button>
            <button data-print="png" title="Download this floor as a high-resolution PNG image of the complete sheet">Download PNG (this floor)</button>
            <button data-print="dxf" title="Download this floor as detailed layered CAD geometry in millimeters for AutoCAD">Download DXF (this floor)</button>
            <button data-print="coohom" title="Download a simplified walls, doors, and windows DXF for Coohom recognition">Download Coohom DXF (this floor)</button>
          </div>
        </div>
        <div class="group" id="view-group">
          <button id="view3d-toggle" type="button" title="Open the interactive 3D model">◈ View 3D</button>
        </div>
        <div class="group" id="ar-group">
          <button id="batch-downloads" type="button" title="Quest setup: request permission for multiple exports by starting two tiny test downloads in the normal browser">⇩ Enable batch downloads</button>
        </div>
        <div class="group">
          <button id="version-status" type="button" title="Check for a newer published build">VERSION · CHECKING</button>
        </div>
        <div class="group hint" id="hint">Drag on the grid to draw a rectangle.</div>
      </footer>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
